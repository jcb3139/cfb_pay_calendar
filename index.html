:root[data-theme=&quot;light&quot;] {

:root[data-theme=&quot;dark&quot;] {

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

  text-underline-offset: 2px;

a:is(:hover, :focus-visible) {

h2,
h3,
h4,

h3,

}

b,
strong,

}

code:not(pre code) {

}

.table :is(th, td) {

  overflow-wrap: anywhere;

  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {

}

.table thead th {

  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

}

}

  gap: 12px;

  padding: 0;

.card {

  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {

  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(

    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(

  background: var(--popover);

  gap: 2px;

  font-weight: var(--font-weight-medium);

  align-items: center;
  gap: 10px;

  border: 0;

  border: 0;

}

  color: var(--accent-foreground);

.viz-controls {

  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {

  gap: 2px 12px;
  margin-bottom: 0;

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {

.btn,
.form-check-input,
.form-control,
.form-range,

  text-decoration: none;

.btn:not(:disabled):hover {

  background: var(--foreground);

  &lt;div class=&quot;header&quot;&gt;
    &lt;div&gt;
      &lt;h2&gt;Four Founders biweekly payroll calendar&lt;/h2&gt;
      &lt;p class=&quot;subtitle&quot;&gt;August 31–December 2026 · Monday–Sunday workweeks · payday the following Friday&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;key&quot; aria-label=&quot;Calendar key&quot;&gt;
      &lt;span class=&quot;key-item&quot;&gt;&lt;span class=&quot;key-fill&quot;&gt;&lt;/span&gt;days earned in a pay period&lt;/span&gt;
      &lt;span class=&quot;key-item&quot;&gt;&lt;span class=&quot;key-pay&quot;&gt;PAY P#&lt;/span&gt;check for that earlier period&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;months&quot; aria-label=&quot;Payroll calendar&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;detail&quot; aria-live=&quot;polite&quot;&gt;
    &lt;strong&gt;Select any colored day or PAY marker&lt;/strong&gt;
    &lt;span&gt; to isolate the related pay period and paycheck.&lt;/span&gt;
    &lt;span class=&quot;future-pay&quot;&gt;&lt;span class=&quot;future-dot&quot;&gt;&lt;/span&gt;* P8 pays Thu. Dec. 24 because of Christmas. P9 continues through Jan. 3 and pays Fri. Jan. 8, 2027.&lt;/span&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;payroll-calendar-2026&#x27;);
      const monthsHost = root.querySelector(&#x27;.months&#x27;);
      const detail = root.querySelector(&#x27;.detail&#x27;);
      const monthNames = [&#x27;Aug. 31–September&#x27;, &#x27;October&#x27;, &#x27;November&#x27;, &#x27;December&#x27;];
      const weekdayNames = [&#x27;Mon&#x27;, &#x27;Tue&#x27;, &#x27;Wed&#x27;, &#x27;Thu&#x27;, &#x27;Fri&#x27;, &#x27;Sat&#x27;, &#x27;Sun&#x27;];
      const periods = [
        { id: &#x27;P1&#x27;, start: &#x27;2026-08-31&#x27;, end: &#x27;2026-09-13&#x27;, pay: &#x27;2026-09-18&#x27;, payLabel: &#x27;Fri. Sept. 18&#x27;, note: &#x27;pay period begins Aug. 31&#x27; },
        { id: &#x27;P2&#x27;, start: &#x27;2026-09-14&#x27;, end: &#x27;2026-09-27&#x27;, pay: &#x27;2026-10-02&#x27;, payLabel: &#x27;Fri. Oct. 2&#x27; },
        { id: &#x27;P3&#x27;, start: &#x27;2026-09-28&#x27;, end: &#x27;2026-10-11&#x27;, pay: &#x27;2026-10-16&#x27;, payLabel: &#x27;Fri. Oct. 16&#x27; },
        { id: &#x27;P4&#x27;, start: &#x27;2026-10-12&#x27;, end: &#x27;2026-10-25&#x27;, pay: &#x27;2026-10-30&#x27;, payLabel: &#x27;Fri. Oct. 30&#x27; },
        { id: &#x27;P5&#x27;, start: &#x27;2026-10-26&#x27;, end: &#x27;2026-11-08&#x27;, pay: &#x27;2026-11-13&#x27;, payLabel: &#x27;Fri. Nov. 13&#x27; },
        { id: &#x27;P6&#x27;, start: &#x27;2026-11-09&#x27;, end: &#x27;2026-11-22&#x27;, pay: &#x27;2026-11-27&#x27;, payLabel: &#x27;Fri. Nov. 27&#x27; },
        { id: &#x27;P7&#x27;, start: &#x27;2026-11-23&#x27;, end: &#x27;2026-12-06&#x27;, pay: &#x27;2026-12-11&#x27;, payLabel: &#x27;Fri. Dec. 11&#x27; },
        { id: &#x27;P8&#x27;, start: &#x27;2026-12-07&#x27;, end: &#x27;2026-12-20&#x27;, pay: &#x27;2026-12-24&#x27;, payLabel: &#x27;Thu. Dec. 24&#x27;, note: &#x27;advanced for Christmas&#x27; },
        { id: &#x27;P9&#x27;, start: &#x27;2026-12-21&#x27;, end: &#x27;2027-01-03&#x27;, pay: &#x27;2027-01-08&#x27;, payLabel: &#x27;Fri. Jan. 8, 2027&#x27;, note: &#x27;continues through Jan. 3&#x27; }
      ];

      const iso = (year, month, day) =&gt; `${year}-${String(month + 1).padStart(2, &#x27;0&#x27;)}-${String(day).padStart(2, &#x27;0&#x27;)}`;
      const displayDate = value =&gt; {
        const [year, month, day] = value.split(&#x27;-&#x27;).map(Number);
        return `${[&#x27;Jan.&#x27;, &#x27;Feb.&#x27;, &#x27;Mar.&#x27;, &#x27;Apr.&#x27;, &#x27;May&#x27;, &#x27;June&#x27;, &#x27;July&#x27;, &#x27;Aug.&#x27;, &#x27;Sept.&#x27;, &#x27;Oct.&#x27;, &#x27;Nov.&#x27;, &#x27;Dec.&#x27;][month - 1]} ${day}${year !== 2026 ? `, ${year}` : &#x27;&#x27;}`;
      };
      const periodFor = value =&gt; periods.find(period =&gt; value &gt;= period.start &amp;&amp; value &lt;= period.end);
      const paydayFor = value =&gt; periods.find(period =&gt; value === period.pay);

      monthNames.forEach((name, offset) =&gt; {
        const month = offset + 8;
        const first = new Date(Date.UTC(2026, month, 1));
        const daysInMonth = new Date(Date.UTC(2026, month + 1, 0)).getUTCDate();
        const mondayIndex = (first.getUTCDay() + 6) % 7;
        const totalCells = Math.ceil((mondayIndex + daysInMonth) / 7) * 7;

        const section = document.createElement(&#x27;section&#x27;);
        section.className = &#x27;month&#x27;;
        section.innerHTML = `&lt;h3 class=&quot;month-title&quot;&gt;${name} 2026&lt;/h3&gt;&lt;div class=&quot;weekdays&quot;&gt;${weekdayNames.map(day =&gt; `&lt;div&gt;${day}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;days&quot;&gt;&lt;/div&gt;`;
        const daysHost = section.querySelector(&#x27;.days&#x27;);

        for (let cell = 0; cell &lt; totalCells; cell += 1) {
          const day = cell - mondayIndex + 1;
          const dayEl = document.createElement(&#x27;div&#x27;);
          if (month === 8 &amp;&amp; cell === 0) {
            const value = &#x27;2026-08-31&#x27;;
            const period = periodFor(value);
            dayEl.className = &#x27;day has-period p1&#x27;;
            dayEl.dataset.period = period.id;
            dayEl.setAttribute(&#x27;role&#x27;, &#x27;button&#x27;);
            dayEl.setAttribute(&#x27;tabindex&#x27;, &#x27;0&#x27;);
            dayEl.setAttribute(&#x27;aria-label&#x27;, &#x27;August 31, P1 starts&#x27;);
            dayEl.innerHTML = &#x27;&lt;span class=&quot;date&quot;&gt;31&lt;/span&gt;&lt;span class=&quot;period-id&quot;&gt;P1&lt;/span&gt;&lt;span class=&quot;boundary&quot;&gt;start&lt;/span&gt;&#x27;;
          } else if (day &lt; 1 || day &gt; daysInMonth) {
            dayEl.className = &#x27;day empty&#x27;;
            dayEl.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
          } else {
            const value = iso(2026, month, day);
            const period = periodFor(value);
            const payday = paydayFor(value);
            dayEl.className = &#x27;day&#x27;;
            dayEl.innerHTML = `&lt;span class=&quot;date&quot;&gt;${day}&lt;/span&gt;`;

            if (period) {
              const number = period.id.slice(1);
              dayEl.classList.add(&#x27;has-period&#x27;, `p${number}`);
              dayEl.dataset.period = period.id;
              dayEl.setAttribute(&#x27;role&#x27;, &#x27;button&#x27;);
              dayEl.setAttribute(&#x27;tabindex&#x27;, &#x27;0&#x27;);
              dayEl.setAttribute(&#x27;aria-label&#x27;, `${displayDate(value)}, ${period.id}`);
              dayEl.insertAdjacentHTML(&#x27;beforeend&#x27;, `&lt;span class=&quot;period-id&quot;&gt;${period.id}&lt;/span&gt;`);
              if (value === period.start) dayEl.insertAdjacentHTML(&#x27;beforeend&#x27;, &#x27;&lt;span class=&quot;boundary&quot;&gt;starts&lt;/span&gt;&#x27;);
              if (value === period.end &amp;&amp; !payday) dayEl.insertAdjacentHTML(&#x27;beforeend&#x27;, &#x27;&lt;span class=&quot;boundary&quot;&gt;ends&lt;/span&gt;&#x27;);
            }

            if (payday) {
              const number = payday.id.slice(1);
              const chip = document.createElement(&#x27;button&#x27;);
              chip.type = &#x27;button&#x27;;
              chip.className = `pay-chip p${number}`;
              chip.dataset.period = payday.id;
              chip.setAttribute(&#x27;aria-label&#x27;, `Payday for ${payday.id}${payday.note ? `, ${payday.note}` : &#x27;&#x27;}`);
              if (payday.note) chip.title = payday.note;
              chip.textContent = `PAY ${payday.id}${payday.id === &#x27;P8&#x27; ? &#x27;*&#x27; : &#x27;&#x27;}`;
              dayEl.appendChild(chip);
            }
          }
          daysHost.appendChild(dayEl);
        }
        monthsHost.appendChild(section);
      });

      const selectPeriod = id =&gt; {
        const period = periods.find(item =&gt; item.id === id);
        if (!period) return;
        const isClearing = root.dataset.selected === id;
        root.querySelectorAll(&#x27;.selected&#x27;).forEach(el =&gt; el.classList.remove(&#x27;selected&#x27;));
        if (isClearing) {
          delete root.dataset.selected;
          detail.innerHTML = &#x27;&lt;strong&gt;Select any colored day or PAY marker&lt;/strong&gt;&lt;span&gt; to isolate the related pay period and paycheck.&lt;/span&gt;&lt;span class=&quot;future-pay&quot;&gt;&lt;span class=&quot;future-dot&quot;&gt;&lt;/span&gt;* P8 pays Thu. Dec. 24 because of Christmas. P9 continues through Jan. 3 and pays Fri. Jan. 8, 2027.&lt;/span&gt;&#x27;;
          return;
        }
        root.dataset.selected = id;
        root.querySelectorAll(`[data-period=&quot;${id}&quot;]`).forEach(el =&gt; el.classList.add(&#x27;selected&#x27;));
        detail.innerHTML = `&lt;strong&gt;${id}: ${displayDate(period.start)}–${displayDate(period.end)}&lt;/strong&gt;&lt;span&gt; → paycheck ${period.payLabel}${period.note ? ` · ${period.note}` : &#x27;&#x27;}&lt;/span&gt;`;
      };

      root.addEventListener(&#x27;click&#x27;, event =&gt; {

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)

    );

              `${Math.max(0, availableHeight)}px`,

      .then(({ x, y }) =&gt; {

      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {

  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;

    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);

  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0

    if (delay === 0) {
      openTooltip(trigger);
      return;
    }

    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
